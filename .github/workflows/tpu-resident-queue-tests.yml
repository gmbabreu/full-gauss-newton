name: TPU resident queue CPU tests

on:
  pull_request:
    branches: [gn-adam-sweep]
    paths:
      - 'scripts/**'
      - '.github/workflows/tpu-resident-queue-tests.yml'
  workflow_dispatch:

jobs:
  cpu-only:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Syntax and compilation
        run: |
          bash -n scripts/tpu.sh
          python -m compileall -q scripts
      - name: Controller queue dry-run (no GCP)
        run: |
          bash scripts/tpu.sh 1 queue scripts/sweeps/gn_large_batch_remaining.json --dry-run > /tmp/queue-preview.log
          grep 'DRY RUN: no GCP calls' /tmp/queue-preview.log
          grep 'B8192_lr0.001' /tmp/queue-preview.log
      - name: Follow-up K25 K100 batch queue dry-run
        run: |
          bash scripts/tpu.sh 1 queue scripts/sweeps/gn_batch_k_followup.json --dry-run > /tmp/queue-followup.log
          grep 'B4096_lr0.002_K25' /tmp/queue-followup.log
          grep 'B4096_lr0.002_K100' /tmp/queue-followup.log
          grep 'B8192_lr0.002_K50' /tmp/queue-followup.log
          grep 'DRY RUN: no GCP calls' /tmp/queue-followup.log
      - name: Two-trial resident smoke queue dry-run
        run: |
          bash scripts/tpu.sh 1 queue scripts/sweeps/gn_resident_smoke.json --dry-run > /tmp/queue-smoke.log
          grep 'smoke_B256_K1' /tmp/queue-smoke.log
          grep 'smoke_B256_K2' /tmp/queue-smoke.log
      - name: Fixed-WD long-horizon LR sweep dry-run
        run: |
          bash scripts/tpu.sh 1 queue scripts/sweeps/gn_lr_250m_followup.json --dry-run > /tmp/queue-lr-250m.log
          python - <<'PY'
          import json
          from pathlib import Path
          text = Path('/tmp/queue-lr-250m.log').read_text()
          prefix = text.index('{')
          data = json.loads(text[prefix:text.rfind('}') + 1])
          expected = [(2048,.001,119,477),(2048,.003,119,477),
                      (3072,.0015,79,318),(3072,.003,79,318),
                      (4096,.002,59,239),(4096,.004,59,239)]
          assert len(data['trials']) == len(expected)
          for item, (batch, lr, steps, horizon) in zip(data['trials'], expected):
              flags = item['plan']['flags']
              assert int(flags['train_dataset_batch_size']) == batch
              assert float(flags['inner_loop_lr']) == lr
              assert int(flags['inner_loop_iter']) == 50
              assert float(flags['optimizer_wd']) == .001
              assert float(flags['inner_loop_wd']) == .01
              assert int(flags['total_steps']) == steps
              assert int(flags['schedule_steps']) == horizon
              assert item['actual_solve_tokens'] == steps * batch * 1024
          assert 'DRY RUN: no GCP calls' in text
          PY
      - name: Repository TPU workflow and resident queue tests
        run: python -m unittest discover -s scripts/tests -v
